<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IoTYK — My Smart Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f8fafc;
      --muted: #94a3b8; --success: #22c55e; --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .container { max-width: 600px; margin: 0 auto; padding: 20px; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; padding: 20px 0; border-bottom: 1px solid #ffffff10; }
    .logo { font-size: 24px; font-weight: 800; color: var(--accent); }
    
    .card { background: var(--card); border-radius: 20px; padding: 30px; margin-bottom: 20px; border: 1px solid #ffffff05; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    h2 { font-size: 20px; margin-bottom: 15px; }
    .hint { font-size: 14px; color: var(--muted); margin-bottom: 20px; }
    
    input { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid #ffffff10; background: #00000030; color: white; font-size: 16px; margin-bottom: 15px; outline: none; }
    input:focus { border-color: var(--accent); }
    
    .btn { width: 100%; padding: 15px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 16px; margin-top: 10px; }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-primary:hover { transform: translateY(-2px); opacity: 0.9; }
    .btn-secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    
    .hidden { display: none; }
    .status-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .status-online { background: #22c55e20; color: #22c55e; }
    
    .device-item { display: flex; justify-content: space-between; align-items: center; padding: 20px; background: #00000020; border-radius: 15px; margin-bottom: 10px; }
    .device-name { font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">⚡ IoTYK</div>
      <button id="btnLogout" class="btn-secondary" style="padding:8px 15px; width:auto; font-size:12px; margin:0">LOGOUT</button>
    </header>

    <!-- ── Login / Register Panel ── -->
    <div id="authPanel" class="card">
      <h2 id="authTitle">Welcome Home</h2>
      <div id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email Address">
        <input type="password" id="loginPass" placeholder="Password">
        <button id="btnLogin" class="btn btn-primary">Login</button>
        <button id="btnShowRegister" class="btn btn-secondary">Create Account</button>
      </div>
      <div id="registerForm" class="hidden">
        <input type="text" id="regName" placeholder="Full Name">
        <input type="email" id="regEmail" placeholder="Email Address">
        <input type="password" id="regPass" placeholder="Password (min 6 chars)">
        <button id="btnRegister" class="btn btn-primary">Register</button>
        <button id="btnShowLogin" class="btn btn-secondary">Back to Login</button>
      </div>
    </div>

    <!-- ── My Devices ── -->
    <div id="userDash" class="hidden">
      <div class="card">
        <h2>Setup New Device</h2>
        <p class="hint">Scanning both Camera and Bluetooth for nearby IoTYK hardware...</p>
        
        <div id="discoveryPanel" style="display:grid; grid-template-columns: 1fr; gap:15px;">
          <div id="qrReader" class="hidden" style="width:100%; border-radius:15px; overflow:hidden; border: 2px solid var(--accent);"></div>
          <button id="btnStartSetup" class="btn btn-primary" style="background:var(--accent); color:#000">🔍 Start Auto-Discovery</button>
        </div>

        <div id="manualPairing" class="hidden" style="border-top: 1px solid #ffffff10; margin-top:20px; padding-top:20px;">
          <input type="text" id="pairDeviceId" placeholder="Device ID">
          <input type="password" id="pairDeviceKey" placeholder="Secret Key">
          <button id="btnPair" class="btn btn-primary">Claim & Finish Setup</button>
        </div>
      </div>

      <h2>My Devices</h2>
      <div id="deviceList">
        <!-- Devices with toggles injected here -->
      </div>
    </div>

      <!-- Local Control Modal -->
      <div id="localControlModal" class="modal hidden">
        <div class="card" style="margin-top:20px;">
          <h2 id="localDeviceTitle">Local Control</h2>
          <div id="wssStatus" class="status-badge status-offline" style="margin-bottom:15px;">DISCONNECTED</div>
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <button onclick="sendLocalCommand('RELAY_ON')" class="btn btn-primary">TURN ON</button>
            <button onclick="sendLocalCommand('RELAY_OFF')" class="btn btn-secondary">TURN OFF</button>
          </div>
          <button id="btnCloseLocal" class="btn btn-secondary" style="margin-top:20px;">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/user.js"></script>
</body>
</html>
