<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IoTYK — Factory Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="logo">⚡ IoTYK Factory</div>
    <div class="header-right">
      <span id="globalUsbStatus" class="status-badge status-offline">USB DISCONNECTED</span>
      <input type="password" id="factoryKeyInput" placeholder="Factory API Key" value="dev-factory-key">
    </div>
  </header>

  <main class="container">
    <section class="card factory-actions">
      <h2>Manufacturing</h2>
      <div class="action-grid">
        <div class="input-group">
          <label>Relay Count</label>
          <input type="number" id="relayCountInput" value="1" min="1" max="8">
        </div>
        <button id="btnProvision" class="btn primary">Generate New Device</button>
        <button id="btnRefresh" class="btn secondary">Refresh List</button>
      </div>
    </section>

    <section id="resultSection" class="card hidden">
      <h2>Device Generated: <span id="lblDeviceId"></span></h2>
      <div class="button-group">
        <button id="btnDownloadFirmwareZip" class="btn primary">Download Flash Package (.ZIP)</button>
        <button id="btnReplaceHardware" class="btn danger">Replace Physical Hardware</button>
      </div>
      <div id="replacePanel" class="hidden" style="margin-top:20px; padding:15px; background:#ef444410; border-radius:10px;">
        <p style="color:var(--danger); font-size:14px; margin-bottom:10px;">⚠️ This will invalidate the previous ESP32 hardware and generate a new Master Key.</p>
        <button id="btnConfirmReplace" class="btn danger small">Confirm Hardware Swap</button>
        <button id="btnCancelReplace" class="btn secondary small">Cancel</button>
      </div>
    </section>

    <section class="card serial-monitor">
      <div class="card-header">
        <h2>USB Serial Monitor</h2>
        <div class="usb-btn-group">
          <button id="btnGlobalConnectUsb" class="btn primary small">Connect USB</button>
          <button id="btnDisconnectUsb" class="btn secondary small">Disconnect</button>
        </div>
      </div>
      
      <div id="authPanel" class="hidden">
        <div class="status-row">
          <span id="usbStatusBadge" class="status-badge status-online">CONNECTED</span>
          <span id="authStatusBadge" class="status-badge status-offline">NOT AUTHENTICATED</span>
        </div>
        <div class="detected-token">Detected Token: <code id="detectedToken">...</code></div>
        <div class="action-grid" style="margin-top:15px;">
          <button id="btnAuthenticate" class="btn primary small" disabled>Authenticate with Device</button>
          <button id="btnSendCredentials" class="btn primary small">Send WiFi & 1h Tokens</button>
          <button id="btnCmdStatus" class="btn secondary small">Fetch Status</button>
          <button id="btnReauth" class="btn secondary small">Request Re-Auth</button>
        </div>
        <div class="action-grid" style="margin-top:10px;">
          <button id="btnClearNvs" class="btn danger small">Clear NVS</button>
          <button id="btnFactoryReset" class="btn danger small">Factory Reset</button>
        </div>
      </div>

      <div id="serialLog" class="serial-log"></div>
      
      <div class="serial-input-row">
        <input type="text" id="serialInput" placeholder="Type command (e.g. RELAY_ON)...">
        <button id="btnSerialSend" class="btn primary small">SEND</button>
        <button id="btnClearLog" class="btn secondary small">CLEAR</button>
      </div>
    </section>

    <section class="card device-list">
      <h2>Device Registry</h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Relays</th>
              <th>Status</th>
              <th>Owner</th>
              <th>Flashes</th>
              <th>Replaced</th>
              <th>Last Flash</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="deviceTableBody">
            <!-- Loaded via JS -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
